[project]
name = "ung-dung-hoc-tap"
version = "0.1.0"
description = "Ung dung hoc tap da nang - TTS, Video, Flashcard, Trac nghiem, Nhat ki"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7.0",
    "sqlalchemy>=2.0.0",
    "edge-tts>=6.1.0",
    "yt-dlp>=2026.6.9",
    "python-mpv>=1.0.5",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "gtts>=2.5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
